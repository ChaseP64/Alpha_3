name: Nightly Performance Regression

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:

jobs:
  perf:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libs for VTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Set VTK off-screen env
        run: echo "VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=ON" >> $GITHUB_ENV

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" ".[3d]"

      - name: Run benchmark tests
        run: |
          pytest -q tests/benchmarks -k "bench or benchmark"

      - name: Upload pytest results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-perf-logs
          path: |
            ./.pytest_cache
            ./pytest_output.txt


